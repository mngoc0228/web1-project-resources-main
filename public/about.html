    <title>Web1 Project - About</title>
    <style type="text/tailwindcss">
        @theme {
        --font-heading: "Changa One", cursive;
        --font-body: "Trebuchet MS", Arial, Helvetica, sans-serif;
    }
    @layer base {
        body {
            @apply font-body;
        }

        h1, h2, h3, h4, h5, h6, nav a{
            @apply font-heading;
        }
    }
    @layer components {
        .active {
          @apply !text-cyan-600;
        }
        footer .active{
          @apply !text-pink-300;
        }
        .read-more{
          @apply !text-cyan-600 underline text-sm;
        }
    }
    </style>
</head>

                            <svg class="w-4 h-4 text-green-500!" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"

                        </li>
                        <li>

                        <li>

                        <li>

                        </li>
                        <li>
                            <a href="contact.html"
                                class="block py-2 px-3 text-heading rounded hover:bg-neutral-tertiary md:hover:bg-transparent md:border-0 md:hover:text-fg-brand md:p-0 md:hover:text-cyan-600! md:dark:hover:bg-transparent">Contact</a>
                        </li>
                        <li>
                            <a href="register.html"
                                class="block py-2 px-3 text-heading rounded hover:bg-neutral-tertiary md:hover:bg-transparent md:border-0 md:hover:text-fg-brand md:p-0 md:hover:text-cyan-600! md:dark:hover:bg-transparent isLogout">Register</a>
                        </li>
                        <li>
                            <a href="#.html"
                                class="block py-2 px-3 text-heading rounded hover:bg-neutral-tertiary md:hover:bg-transparent md:border-0 md:hover:text-fg-brand md:p-0 md:hover:text-cyan-600! md:dark:hover:bg-transparent isLogin">Profile</a>
                        </li>
                        <li>

                        </li>
                        <li>

    </header>
    <!-- Banner with Carousel -->
    <section class="w-full bg-cyan-600 text-white bg-[url('images/bg-banner.gif')] bg-repeat h-2">
    </section>

    <!-- About us & Our vision -->
    <section class="max-w-7xl mx-auto py-8 px-8">
        <div class="flex flex-col md:grid md:grid-cols-[6.5fr_3.5fr] gap-8">
            <div>
                <div id="aboutus">
                    <img src="images/system/preloader.gif" alt="">
                </div>

                <div class="grow">
                    <h1 class="font-heading text-7xl mb-8">Our Vision</h1>
                    <div id="visions">
                        <img src="images/system/preloader.gif" alt="">
                    </div>
                </div>
            </div>
    </section>

    <!-- Testimonials -->
    <section class="w-full bg-pink-300 pb-8">
        <div class="max-w-7xl mx-auto py-8 px-8">
            <h1 class="font-heading text-7xl text-white mb-8">
                Testimonials
            </h1>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8" id="testimonials">
                <img src="images/system/preloader.gif" alt="">
            </div>
        </div>
    </section>

    <!-- Our Team -->
    <section class="max-w-7xl mx-auto py-8 px-8">

        <div id="team" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-8">
            <img src="images/system/preloader.gif" alt="">
        </div>
    </section>

    <!--Footer-->
    <footer class="w-full bg-[url('images/bg-footer.gif')] bg-repeat bg-gray-600 text-white text-center py-4">
        <nav class="max-w-7xl mx-auto flex items-center justify-center p-4">
            <ul class="font-medium flex flex-col p-4 md:p-0 mt-4 md:flex-row md:space-x-8 rtl:space-x-reverse md:mt-0">

                    <a href="index.html"
                        class="block py-2 px-3 text-white rounded md:bg-transparent md:text-fg-brand md:p-0">Home</a>
                </li>
                <li>
                    <a href="about.html"
                        class="block py-2 px-3 text-heading rounded md:border-0 md:hover:text-fg-brand md:p-0 md:hover:text-pink-300! md:dark:hover:bg-transparent active"

                <li>

                <li>

                <li>

            </div>

    <!--Flowbite-->
    <script src="https://flowbite.com/docs/flowbite.min.js"></script>
    <!-- HandlebarJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.7.8/handlebars.min.js"></script>
    <script id="aboutus-template" type="text/x-handlebars-template">
    {{#each data}}
        <h1 class="font-heading text-7xl mb-8">{{title}}</h1>
        <div>
            <a href="details.html?id={{id}}"><img src="{{thumbpath}}" alt="" class="rounded-xl mb-8 me-8 lg:float-start"></a>
            <div class="text-justify">{{{summary}}}</div>
        </div>
        <a href="details.html?id={{id}}" class="read-more"></a>
    {{/each}} 
</script>

    <script id="vision-template" type="text/x-handlebars-template">
    {{#each data}}
        <div class="flex mt-4 gap-4">
            <div class="basis-xs">
                <a href="details.html?id={{id}}"><img src="{{thumbpath}}" alt="" class="rounded-2xl w-full"></a>
            </div>
            <div class="grow">
                <a href="details.html?id={{id}}">
                    <h2 class="text-3xl font-heading mb-4 hover:hightlight">{{title}}</h2>
                </a>
                <p>{{summary}}</p>
            </div>
        </div>
    {{/each}}
</script>
    <script id="team-template" type="text/x-handlebars-template">
    {{#each data}}
        <div>
            <a href="details.html?id={{id}}"><img src="{{thumbpath}}" alt="" class="rounded-2xl w-full"></a>
            <a href="details.html?id={{id}}">
                <h2 class="text-3xl font-heading py-4 hover:hightlight">{{title}}</h2>
            </a>
            <p class="text-justify">{{summary}}</p>
        </div>
    {{/each}}
</script>
    <script id="testimonials-template" type="text/x-handlebars-template">
    {{#each data}}
<div class="bg-[url('images/quot.png')] bg-top-left bg-no-repeat p-11">
                    <p class="text-justify">{{message}}</p>
                    <p class="text-white mt-4">{{name}}</p>
                    <a href="mailto:email@email.com" class="read-more">{{email}}</a>
                </div>
                   {{/each}}
</script>
    <!-- Supabase-->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">

    </script>
    <script src="js/24880044.js"></script>
    <script src="js/api/database.js"></script>
    <script>
        (async function () {
            const [allData, testimonials] = await Promise.all([
                fetchDataByTypes(["aboutus", "visions", "team"]),
                fetchTestimonials(),
            ]);

            const aboutus = allData.filter(d => d.type == "aboutus");
            const visions = allData.filter(d => d.type == "visions");
            const team = allData.filter(d => d.type == "team");


            renderView("aboutus-template", "aboutus", aboutus);
            renderView("vision-template", "visions", visions);
            renderView("team-template", "team", team);

            renderView("testimonials-template", "testimonials", testimonials);
        })();
    </script>
</body>
